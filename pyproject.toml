[project]
name = "rlime"
version = "0.1.1"
description = "Implementation of R-LIME, a novel method for interpreting the behavior of ML models."
dependencies = [
    "anchor-exp>=0.0.2.0",
    "pandas>=2.3.3",
    "river>=0.22.0",
    "scikit-learn>=1.5.0",
]
readme = "README.md"
requires-python = ">=3.12.3"

[dependency-groups]
dev = [
    "build>=1.3.0",
    "pyright[nodejs]>=1.1.406",
    "ruff>=0.13.3",
    "twine>=6.2.0",
]

[tool.pyright]
typeCheckingMode = "strict"

[tool.ruff]
exclude = [".venv"]
line-length = 79
indent-width = 4

[tool.ruff.lint]
select = ["ALL"]
ignore = ["COM812", "ISC001"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = true
line-ending = "lf"

[tool.ruff.lint.isort]
split-on-trailing-comma = false

[tool.ruff.lint.pydocstyle]
convention = "google"

